spring.application.name=wash-car-service-server
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=wash_car_service;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:sa}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:change-this-development-secret-change-this-development-secret}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.loyalty.points-amount-unit=${LOYALTY_POINTS_AMOUNT_UNIT:10000}
app.loyalty.point-expiry-months=${LOYALTY_POINT_EXPIRY_MONTHS:12}
app.admin.seed-phone=${ADMIN_SEED_PHONE:0900000000}
app.admin.seed-password=${ADMIN_SEED_PASSWORD:Admin@123456}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
