<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wash Car Service Project Report</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #64748b;
        --line: #d8dee8;
        --panel: #ffffff;
        --bg: #f6f8fb;
        --brand: #0f766e;
        --accent: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      header {
        display: grid;
        gap: 14px;
        padding: 28px 0 22px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3.4rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      .links a {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        font-weight: 650;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 22px;
      }

      section {
        padding: 20px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 1.05rem;
        letter-spacing: 0;
      }

      ul {
        margin: 0;
        padding-left: 18px;
      }

      li {
        margin: 8px 0;
        color: #334155;
        line-height: 1.5;
      }

      .badge-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 0 10px;
        border-radius: 999px;
        background: #dff7f3;
        color: var(--brand);
        font-weight: 700;
        font-size: 0.88rem;
      }

      @media (max-width: 780px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Wash Car Service Backend Report</h1>
        <p id="scope">Loading project report...</p>
        <div class="badge-row" id="roles"></div>
        <nav class="links" id="links"></nav>
      </header>
      <div class="grid" id="sections"></div>
    </main>

    <script>
      async function loadReport() {
        const response = await fetch("/api/project-report");
        const payload = await response.json();
        const report = payload.data;

        document.getElementById("scope").textContent = report.scope;
        document.getElementById("roles").innerHTML = report.roles
          .map((role) => `<span class="badge">${role}</span>`)
          .join("");
        document.getElementById("links").innerHTML = report.links
          .map((link) => `<a href="${link.url}">${link.label}</a>`)
          .join("");
        document.getElementById("sections").innerHTML = report.sections
          .map(
            (section) => `
              <section>
                <h2>${section.title}</h2>
                <ul>${section.points.map((point) => `<li>${point}</li>`).join("")}</ul>
              </section>
            `
          )
          .join("");
      }

      loadReport().catch(() => {
        document.getElementById("scope").textContent = "Could not load report data.";
      });
    </script>
  </body>
</html>
